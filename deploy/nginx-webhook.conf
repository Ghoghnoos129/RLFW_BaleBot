# نمونه تنظیمات Nginx برای دریافت امن وبهوک گیت‌هاب و فوروارد به دریافت‌کننده‌ی داخلی.
#
# قبل از استفاده:
#   1) deploy.yourdomain.com را با دامنه واقعی خودتان جایگزین کنید
#   2) /hooks/REPLACE_WITH_RANDOM_TOKEN را با همان مقداری که bootstrap.sh در
#      deploy/webhook.env برای WEBHOOK_PATH ساخته، جایگزین کنید
#   3) گواهی TLS را با certbot بسازید:
#        sudo certbot --nginx -d deploy.yourdomain.com
#      (قبل از آن این فایل را بدون بلوک ssl_certificate روی پورت 80 فعال کنید تا
#      certbot بتواند challenge را جواب دهد؛ certbot خودش خط‌های ssl را اضافه می‌کند)

limit_req_zone $binary_remote_addr zone=gh_webhook:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name deploy.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deploy.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/deploy.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # payload گیت‌هاب معمولا چند کیلوبایت است؛ سقف کوچک برای جلوگیری از سوءاستفاده
    client_max_body_size 1m;

    # --- تنها مسیر فعال: دقیقاً همان مسیر تصادفی تولیدشده توسط bootstrap.sh ---
    location = /hooks/REPLACE_WITH_RANDOM_TOKEN {
        limit_req zone=gh_webhook burst=3 nodelay;

        if ($request_method != POST) {
            return 405;
        }

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # هر مسیر دیگری رد می‌شود — این دامنه فقط برای وبهوک است، هیچ صفحه دیگری ندارد
    location / {
        return 404;
    }

    access_log /var/log/nginx/RLFW_BaleBot-webhook.access.log;
    error_log  /var/log/nginx/RLFW_BaleBot-webhook.error.log;
}

# --- لایه اختیاری امنیتی اضافه (defense-in-depth) ---
# اگر خواستید علاوه بر HMAC، دسترسی را به رنج آی‌پی‌های گیت‌هاب هم محدود کنید،
# می‌توانید به جای (یا علاوه بر) GITHUB_IP_ALLOWLIST در webhook.env، از دستورات
# allow/deny در همین location استفاده کنید. فهرست رسمی و به‌روز رنج‌ها اینجاست:
#   https://api.github.com/meta   (کلید "hooks")
# چون این رنج‌ها گاهی عوض می‌شوند، HMAC همیشه خط دفاعی اصلی است، نه این IPها.
