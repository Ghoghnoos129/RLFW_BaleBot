name: rlfw_balebot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # توجه: مقدار پیش‌فرض را به آینه داخلی تغییر دادیم تا Coolify هنگام build
        # مستقیماً از آینه استفاده کند و درگیر تحریم 403 Docker Hub نشود.
        # اگر آینه دیگری مدنظر دارید، BASE_IMAGE را در .env یا Build Variable در
        # Coolify تنظیم کنید (مثلاً docker.ththt.ir یا docker.arvancloud.ir).
        BASE_IMAGE: ${BASE_IMAGE:-docker.abrha.net/library/python:3.12-slim-bookworm}
    image: rlfw_balebot:latest
    container_name: RLFW_BaleBot
    restart: unless-stopped

    env_file:
      - .env

    # --- سخت‌سازی امنیتی کانتینر ---
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # خط pid حذف شد — Docker به طور پیش‌فرض PID namespace ایزوله می‌سازد.
    ipc: "none"
    networks:
      - internal_only

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m

    volumes:
      - bot_data:/app/data

    # --- محدودیت منابع ---
    cpus: "0.50"
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal_only:
    driver: bridge
    internal: false

volumes:
  bot_data:
    driver: local
