name: rlfw_balebot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ایمیج پایه: پیش‌فرض Docker Hub (سرور اصلی). اگر با deploy/build_with_fallback.sh
        # بسازید، اولین ایمیجِ در دسترس از لیست آینه‌ها خودکار اینجا قرار می‌گیرد.
        # (در Coolify فقط همین یک مقدار را می‌توان با Build Variable عوض کرد.)
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim-bookworm}
        # آینه‌های pip و apt (جداشده با فاصله) — فقط وقتی منبع اصلی جواب ندهد استفاده می‌شوند.
        PIP_MIRRORS: ${PIP_MIRRORS:-https://mirror-pypi.runflare.com/simple https://pypi.tuna.tsinghua.edu.cn/simple https://mirrors.aliyun.com/pypi/simple https://pypi.mirrors.ustc.edu.cn/simple}
        APT_MIRRORS: ${APT_MIRRORS:-http://mirror.arvancloud.ir/debian http://ftp.de.debian.org/debian http://mirrors.kernel.org/debian http://ftp.us.debian.org/debian}
    # نام ایمیج داکر باید حتما lowercase باشد (محدودیت رجیستری داکر)؛ نام نمایشی/کانتینر
    # همچنان RLFW_BaleBot است.
    image: rlfw_balebot:latest
    container_name: RLFW_BaleBot
    restart: unless-stopped

    env_file:
      - .env

    # --- سخت‌سازی امنیتی کانتینر ---
    user: "10001:10001"               # همان appuser داخل Dockerfile، هرگز روت اجرا نشود
    read_only: true                    # فایل‌سیستم ریشه فقط-خواندنی؛ فقط data/ و tmp قابل نوشتن‌اند
    security_opt:
      - no-new-privileges:true         # جلوگیری از افزایش دسترسی (setuid و مشابه)
    cap_drop:
      - ALL                            # هیچ Linux capability اضافه‌ای لازم ندارد
    # توجه: خط pid حذف شد — Docker به طور پیش‌فرض برای هر کانتینر یک PID namespace
    # جداگانه و ایزوله می‌سازد (امن‌ترین حالت). مقدار "container" به تنهایی نامعتبر است
    # و باعث خطای «invalid PID mode: container» می‌شد.
    ipc: "none"                        # بدون نیاز به IPC مشترک
    networks:
      - internal_only                  # بدون دسترسی به شبکه خارجی به جز از طریق NAT خروجی معمول

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m

    volumes:
      - bot_data:/app/data            # تنها مسیر قابل‌نوشتن: دیتابیس sqlite + لاگ + heartbeat

    # --- محدودیت منابع، برای جلوگیری از مصرف بی‌رویه در صورت باگ/حمله ---
    cpus: "0.50"
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 64

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  internal_only:
    driver: bridge
    internal: false   # false چون ربات باید به tapi.bale.ai (اینترنت) وصل شود؛ هیچ پورتی هم به بیرون expose نمی‌شود

volumes:
  bot_data:
    driver: local
